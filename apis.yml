name: Baicai
description: >-
  Baicai (白菜二手车, "Baicai Used Cars") is a Chinese used-vehicle trading platform
  operating a new-retail model that pairs online used-car marketplaces with
  offline chain "used-car supermarket" stores. Vehicles listed on the platform
  are inspected by third-party agencies (100+ point checks that exclude major
  accident, water-damaged, and fire-damaged cars) and carry a return guarantee
  plus a warranty on major components. The business was spun out of and operates
  under 58.com (via Tianjin 58 Cloud Car / 天津五八云车) and became independently
  operated in 2021. It received early seed backing from Ribbit Capital. Baicai is
  a consumer-facing marketplace and does not publish a public developer platform,
  API, SDKs, or API documentation; this profile captures its identity and public
  web presence for the API Evangelist network.
